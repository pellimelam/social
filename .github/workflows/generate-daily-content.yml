name: Generate Vidhwaan Daily Social Content

on:
  schedule:
    - cron: "0 1 * * *"
      timezone: "Asia/Kolkata"

  workflow_dispatch:
    inputs:
      target_date:
        description: "Optional date in YYYY-MM-DD format. Leave empty for today's India date."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: vidhwaan-daily-social-content
  cancel-in-progress: false

jobs:
  generate:
    name: Generate Daily Telugu Content
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TZ: Asia/Kolkata
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: openai/gpt-oss-120b

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "Vidhwaan Daily Social"
          git config user.email "actions@users.noreply.github.com"

      - name: Determine publication date
        id: date
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${{ inputs.target_date }}" ]; then
            TARGET_DATE="${{ inputs.target_date }}"
          else
            TARGET_DATE="$(TZ=Asia/Kolkata date '+%Y-%m-%d')"
          fi

          if ! [[ "$TARGET_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "ERROR: Invalid date: $TARGET_DATE"
            echo "Expected format: YYYY-MM-DD"
            exit 1
          fi

          if ! date -d "$TARGET_DATE" '+%Y-%m-%d' >/dev/null 2>&1; then
            echo "ERROR: Invalid calendar date: $TARGET_DATE"
            exit 1
          fi

          echo "target_date=$TARGET_DATE" >> "$GITHUB_OUTPUT"

          echo "========================================"
          echo "Vidhwaan Daily Social"
          echo "Publication date: $TARGET_DATE"
          echo "Timezone: Asia/Kolkata"
          echo "========================================"

      - name: Create data directory
        run: |
          mkdir -p data

      - name: Check whether today's JSON already exists
        id: existing
        shell: bash
        run: |
          set -euo pipefail

          TARGET_DATE="${{ steps.date.outputs.target_date }}"
          TARGET_FILE="data/${TARGET_DATE}.json"

          if [ -f "$TARGET_FILE" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Already exists: $TARGET_FILE"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No existing JSON for $TARGET_DATE"
          fi

      - name: Stop because today's content already exists
        if: steps.existing.outputs.exists == 'true'
        run: |
          echo "Today's Vidhwaan Daily Social content already exists."
          echo "No new generation is required."

      - name: Build recent content context
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail

          CONTEXT_FILE="/tmp/recent-content.txt"

          printf '%s\n' \
            "Recent Vidhwaan Daily Social topics:" \
            "" \
            > "$CONTEXT_FILE"

          find data \
            -maxdepth 1 \
            -type f \
            -name '*.json' \
            -printf '%f\n' |
            sort -r |
            head -n 14 |
            while read -r FILE; do

              echo "--- $FILE ---" >> "$CONTEXT_FILE"

              python3 - "$FILE" <<'PY' >> "$CONTEXT_FILE"
import json
import sys
from pathlib import Path

filename = sys.argv[1]
path = Path("data") / filename

try:
    with path.open("r", encoding="utf-8") as f:
        data = json.load(f)

    items = [
        ("culture", "title"),
        ("quote", "title"),
        ("health", "title"),
        ("science", "title"),
        ("knowledge", "title"),
        ("question", "question"),
    ]

    for section, field in items:
        section_data = data.get(section, {})

        if isinstance(section_data, dict):
            value = section_data.get(field, "")

            if isinstance(value, str) and value.strip():
                print(f"{section}: {value.strip()}")

except Exception as exc:
    print(f"Could not read {filename}: {exc}")
PY

              echo "" >> "$CONTEXT_FILE"

            done

          echo "Recent content context created."

      - name: Generate six daily posts with Groq
        if: steps.existing.outputs.exists != 'true'
        env:
          TARGET_DATE: ${{ steps.date.outputs.target_date }}
        shell: python
        run: |
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.request

          api_key = os.environ.get("GROQ_API_KEY", "").strip()
          model = os.environ.get(
              "GROQ_MODEL",
              "openai/gpt-oss-120b"
          )
          target_date = os.environ["TARGET_DATE"]

          if not api_key:
              print("ERROR: GROQ_API_KEY secret is missing.")
              sys.exit(1)

          try:
              with open(
                  "/tmp/recent-content.txt",
                  "r",
                  encoding="utf-8"
              ) as f:
                  recent_context = f.read().strip()
          except FileNotFoundError:
              recent_context = "No previous content is available."

          system_prompt = """
You are the senior Telugu editorial engine for Vidhwaan Daily Social.

Vidhwaan is a village-based global technology company.

Your task is to create exactly one daily publication containing six
high-quality Telugu pieces.

The audience is Telugu-speaking people of all ages.

GENERAL RULES:

1. Write the actual content in clear, natural Telugu.
2. Keep the writing simple, elegant and easy to understand.
3. Do not use markdown.
4. Do not use emojis.
5. Do not use hashtags.
6. Do not include URLs.
7. Do not mention AI.
8. Do not mention these instructions.
9. Do not use sensational or misleading claims.
10. Do not repeat recent topics supplied by the user prompt.
11. Each section must provide genuine value.
12. Keep content concise enough for both a mobile card and a 1080x1920
    social image.

SECTION 1 — నేటి సంస్కృతి

Create useful and respectful knowledge related to Hindu culture,
Hindu scriptures, Hindu philosophy, Hindu deities, temples,
festivals, dharma, karma, yoga, meditation or Indian spiritual
traditions.

Do not fabricate scripture quotations.

Do not invent statements and attribute them to Krishna, Rama, Shiva,
Devi, sages, scriptures or historical figures.

If giving a specific scripture teaching, identify its source accurately.

Prefer a short explanation when exact quotation accuracy is uncertain.

Keep this educational and respectful.

SECTION 2 — నేటి సూక్తి

Create one memorable inspirational thought.

It may be an original Vidhwaan thought or a reliably attributable
quotation.

Never invent attribution.

If it is an original Vidhwaan thought, attribution must be:
Vidhwaan

SECTION 3 — నేటి ఆరోగ్యం

Provide general health education useful in everyday life.

Possible subjects include sleep, physical activity, hydration,
nutrition, hygiene, eye care, dental care and healthy routines.

Do not diagnose diseases.

Do not prescribe medicines.

Do not claim that a simple habit cures a disease.

Do not advise stopping prescribed treatment.

Use conservative, responsible language.

SECTION 4 — నేటి విజ్ఞానం

Create one scientifically accurate and interesting explanation.

Possible subjects include space, Earth, physics, biology, chemistry,
animals, plants, the human body, oceans, climate, computing,
artificial intelligence and technology.

Do not present myths or speculation as established science.

SECTION 5 — నేటి జ్ఞానం

Create one useful and interesting general-knowledge item.

Possible subjects include history, geography, languages, mathematics,
inventions, architecture, agriculture, countries, cultures and
interesting everyday facts.

The reader should learn something genuinely useful or interesting.

SECTION 6 — నేటి ప్రశ్న

Create one enjoyable thinking question.

It can be a logic puzzle, reasoning problem, mathematics puzzle,
observation problem, science reasoning problem or lateral-thinking
problem.

The question must contain enough information to solve it.

It must have a definite answer.

The answer must actually solve the question.

Do not depend on obscure trivia.

The answer should be clearly explained.

QUALITY:

Make the six sections substantially different.

Do not make every culture post about the same deity.

Do not make every science post about space.

Do not make every quote generic.

Do not make every question the same type of riddle.
"""

          user_prompt = f"""
Create the Vidhwaan Daily Social publication for:

DATE: {target_date}

All six sections must be fresh.

Avoid repeating or substantially copying the recent topics listed below.

RECENT CONTENT:

{recent_context}

Generate exactly:

1. culture
2. quote
3. health
4. science
5. knowledge
6. question

All actual content must be in Telugu.
"""

          schema = {
              "type": "object",
              "properties": {
                  "date": {
                      "type": "string"
                  },
                  "language": {
                      "type": "string"
                  },
                  "publisher": {
                      "type": "string"
                  },
                  "culture": {
                      "type": "object",
                      "properties": {
                          "heading": {
                              "type": "string"
                          },
                          "title": {
                              "type": "string"
                          },
                          "content": {
                              "type": "string"
                          },
                          "source": {
                              "type": "string"
                          }
                      },
                      "required": [
                          "heading",
                          "title",
                          "content",
                          "source"
                      ],
                      "additionalProperties": False
                  },
                  "quote": {
                      "type": "object",
                      "properties": {
                          "heading": {
                              "type": "string"
                          },
                          "title": {
                              "type": "string"
                          },
                          "content": {
                              "type": "string"
                          },
                          "attribution": {
                              "type": "string"
                          }
                      },
                      "required": [
                          "heading",
                          "title",
                          "content",
                          "attribution"
                      ],
                      "additionalProperties": False
                  },
                  "health": {
                      "type": "object",
                      "properties": {
                          "heading": {
                              "type": "string"
                          },
                          "title": {
                              "type": "string"
                          },
                          "content": {
                              "type": "string"
                          }
                      },
                      "required": [
                          "heading",
                          "title",
                          "content"
                      ],
                      "additionalProperties": False
                  },
                  "science": {
                      "type": "object",
                      "properties": {
                          "heading": {
                              "type": "string"
                          },
                          "title": {
                              "type": "string"
                          },
                          "content": {
                              "type": "string"
                          }
                      },
                      "required": [
                          "heading",
                          "title",
                          "content"
                      ],
                      "additionalProperties": False
                  },
                  "knowledge": {
                      "type": "object",
                      "properties": {
                          "heading": {
                              "type": "string"
                          },
                          "title": {
                              "type": "string"
                          },
                          "content": {
                              "type": "string"
                          }
                      },
                      "required": [
                          "heading",
                          "title",
                          "content"
                      ],
                      "additionalProperties": False
                  },
                  "question": {
                      "type": "object",
                      "properties": {
                          "heading": {
                              "type": "string"
                          },
                          "question": {
                              "type": "string"
                          },
                          "answer": {
                              "type": "string"
                          }
                      },
                      "required": [
                          "heading",
                          "question",
                          "answer"
                      ],
                      "additionalProperties": False
                  }
              },
              "required": [
                  "date",
                  "language",
                  "publisher",
                  "culture",
                  "quote",
                  "health",
                  "science",
                  "knowledge",
                  "question"
              ],
              "additionalProperties": False
          }

          payload = {
              "model": model,
              "messages": [
                  {
                      "role": "system",
                      "content": system_prompt.strip()
                  },
                  {
                      "role": "user",
                      "content": user_prompt.strip()
                  }
              ],
              "response_format": {
                  "type": "json_schema",
                  "json_schema": {
                      "name": "vidhwaan_daily_social",
                      "strict": True,
                      "schema": schema
                  }
              },
              "temperature": 0.7,
              "max_completion_tokens": 6000
          }

          request_data = json.dumps(
              payload,
              ensure_ascii=False
          ).encode("utf-8")

          request_url = (
              "https://api.groq.com/openai/v1/chat/completions"
          )

          headers = {
              "Authorization": f"Bearer {api_key}",
              "Content-Type": "application/json",
              "Accept": "application/json",
              "User-Agent": "Vidhwaan-Daily-Social"
          }

          max_attempts = 3
          response_data = None

          for attempt in range(1, max_attempts + 1):

              print(
                  f"Groq request attempt "
                  f"{attempt}/{max_attempts}..."
              )

              request = urllib.request.Request(
                  request_url,
                  data=request_data,
                  headers=headers,
                  method="POST"
              )

              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=300
                  ) as response:

                      response_text = (
                          response.read()
                          .decode("utf-8")
                      )

                      response_data = json.loads(
                          response_text
                      )

                      break

              except urllib.error.HTTPError as exc:

                  error_text = exc.read().decode(
                      "utf-8",
                      errors="replace"
                  )

                  print(
                      f"Groq HTTP error: {exc.code}"
                  )

                  print(error_text[:5000])

                  retryable_codes = {
                      408,
                      409,
                      429,
                      500,
                      502,
                      503,
                      504
                  }

                  if (
                      exc.code not in retryable_codes
                      or attempt == max_attempts
                  ):
                      sys.exit(1)

                  wait_seconds = 30 * attempt

                  print(
                      f"Retrying in "
                      f"{wait_seconds} seconds..."
                  )

                  time.sleep(wait_seconds)

              except (
                  urllib.error.URLError,
                  TimeoutError,
                  ConnectionError
              ) as exc:

                  print(
                      f"Connection error: {exc}"
                  )

                  if attempt == max_attempts:
                      sys.exit(1)

                  wait_seconds = 30 * attempt

                  print(
                      f"Retrying in "
                      f"{wait_seconds} seconds..."
                  )

                  time.sleep(wait_seconds)

          if response_data is None:
              print("ERROR: Groq returned no response.")
              sys.exit(1)

          try:
              generated_text = (
                  response_data["choices"][0]
                  ["message"]["content"]
              )
          except (
              KeyError,
              IndexError,
              TypeError
          ):
              print("ERROR: Unexpected Groq response.")
              print(
                  json.dumps(
                      response_data,
                      ensure_ascii=False,
                      indent=2
                  )[:10000]
              )
              sys.exit(1)

          if (
              not isinstance(generated_text, str)
              or not generated_text.strip()
          ):
              print("ERROR: Groq returned empty content.")
              sys.exit(1)

          try:
              daily_data = json.loads(
                  generated_text
              )
          except json.JSONDecodeError as exc:
              print(
                  f"ERROR: Generated content is not valid JSON: {exc}"
              )
              print(generated_text[:10000])
              sys.exit(1)

          with open(
              "/tmp/daily-generated.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  daily_data,
                  f,
                  ensure_ascii=False,
                  indent=2
              )
              f.write("\n")

          print("Groq generation completed.")

      - name: Validate generated JSON
        if: steps.existing.outputs.exists != 'true'
        env:
          TARGET_DATE: ${{ steps.date.outputs.target_date }}
        shell: python
        run: |
          import json
          import os
          import re
          import sys
          from pathlib import Path

          target_date = os.environ["TARGET_DATE"]

          source = Path(
              "/tmp/daily-generated.json"
          )

          output = Path(
              "data"
          ) / f"{target_date}.json"

          if not source.exists():
              print(
                  "ERROR: Generated JSON does not exist."
              )
              sys.exit(1)

          try:
              with source.open(
                  "r",
                  encoding="utf-8"
              ) as f:
                  data = json.load(f)
          except Exception as exc:
              print(
                  f"ERROR: Could not parse JSON: {exc}"
              )
              sys.exit(1)

          required_top_level = [
              "date",
              "language",
              "publisher",
              "culture",
              "quote",
              "health",
              "science",
              "knowledge",
              "question"
          ]

          for key in required_top_level:
              if key not in data:
                  print(
                      f"ERROR: Missing field: {key}"
                  )
                  sys.exit(1)

          if data["date"] != target_date:
              print(
                  "ERROR: Date mismatch."
              )
              print(
                  f"Expected: {target_date}"
              )
              print(
                  f"Received: {data['date']}"
              )
              sys.exit(1)

          if data["language"] != "te":
              print(
                  "ERROR: language must be 'te'."
              )
              sys.exit(1)

          if data["publisher"] != "Vidhwaan":
              print(
                  "ERROR: publisher must be 'Vidhwaan'."
              )
              sys.exit(1)

          section_fields = {
              "culture": [
                  "heading",
                  "title",
                  "content",
                  "source"
              ],
              "quote": [
                  "heading",
                  "title",
                  "content",
                  "attribution"
              ],
              "health": [
                  "heading",
                  "title",
                  "content"
              ],
              "science": [
                  "heading",
                  "title",
                  "content"
              ],
              "knowledge": [
                  "heading",
                  "title",
                  "content"
              ],
              "question": [
                  "heading",
                  "question",
                  "answer"
              ]
          }

          for section, fields in section_fields.items():

              if not isinstance(
                  data[section],
                  dict
              ):
                  print(
                      f"ERROR: {section} must be an object."
                  )
                  sys.exit(1)

              for field in fields:

                  if field not in data[section]:
                      print(
                          f"ERROR: Missing "
                          f"{section}.{field}"
                      )
                      sys.exit(1)

                  value = data[section][field]

                  if not isinstance(
                      value,
                      str
                  ):
                      print(
                          f"ERROR: "
                          f"{section}.{field} "
                          f"must be a string."
                      )
                      sys.exit(1)

                  if not value.strip():
                      print(
                          f"ERROR: "
                          f"{section}.{field} "
                          f"is empty."
                      )
                      sys.exit(1)

          expected_headings = {
              "culture": "నేటి సంస్కృతి",
              "quote": "నేటి సూక్తి",
              "health": "నేటి ఆరోగ్యం",
              "science": "నేటి విజ్ఞానం",
              "knowledge": "నేటి జ్ఞానం",
              "question": "నేటి ప్రశ్న"
          }

          for section, expected in (
              expected_headings.items()
          ):

              actual = data[section]["heading"].strip()

              if actual != expected:
                  print(
                      f"ERROR: Incorrect heading for "
                      f"{section}."
                  )
                  print(
                      f"Expected: {expected}"
                  )
                  print(
                      f"Received: {actual}"
                  )
                  sys.exit(1)

          telugu_pattern = re.compile(
              r"[\u0C00-\u0C7F]"
          )

          text_fields = [
              ("culture", "title"),
              ("culture", "content"),
              ("quote", "title"),
              ("quote", "content"),
              ("health", "title"),
              ("health", "content"),
              ("science", "title"),
              ("science", "content"),
              ("knowledge", "title"),
              ("knowledge", "content"),
              ("question", "question"),
              ("question", "answer")
          ]

          for section, field in text_fields:

              value = data[section][field]

              if not telugu_pattern.search(value):
                  print(
                      f"ERROR: "
                      f"{section}.{field} "
                      f"contains no Telugu text."
                  )
                  sys.exit(1)

          length_limits = {
              ("culture", "title"): 180,
              ("culture", "content"): 1200,
              ("culture", "source"): 300,

              ("quote", "title"): 180,
              ("quote", "content"): 600,
              ("quote", "attribution"): 200,

              ("health", "title"): 180,
              ("health", "content"): 1200,

              ("science", "title"): 180,
              ("science", "content"): 1200,

              ("knowledge", "title"): 180,
              ("knowledge", "content"): 1200,

              ("question", "question"): 800,
              ("question", "answer"): 1000
          }

          for (
              section,
              field
          ), maximum in length_limits.items():

              value = data[section][field]

              if len(value) > maximum:
                  print(
                      f"ERROR: "
                      f"{section}.{field} is too long."
                  )
                  print(
                      f"Length: {len(value)}"
                  )
                  print(
                      f"Maximum: {maximum}"
                  )
                  sys.exit(1)

          all_content = []

          for section, fields in (
              section_fields.items()
          ):
              for field in fields:
                  all_content.append(
                      data[section][field]
                  )

          combined = "\n".join(
              all_content
          )

          forbidden = [
              "```",
              "http://",
              "https://",
              "www.",
              "###"
          ]

          for pattern in forbidden:

              if pattern in combined:
                  print(
                      "ERROR: Forbidden pattern found:"
                  )
                  print(pattern)
                  sys.exit(1)

          allowed_top_level = set(
              required_top_level
          )

          unexpected = (
              set(data.keys())
              - allowed_top_level
          )

          if unexpected:
              print(
                  "ERROR: Unexpected fields:"
              )
              print(
                  ", ".join(
                      sorted(unexpected)
                  )
              )
              sys.exit(1)

          output.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          with output.open(
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  data,
                  f,
                  ensure_ascii=False,
                  indent=2
              )
              f.write("\n")

          with output.open(
              "r",
              encoding="utf-8"
          ) as f:
              json.load(f)

          print("")
          print("========================================")
          print("VALIDATION PASSED")
          print("========================================")
          print(f"Date: {target_date}")
          print(f"File: {output}")
          print("Language: Telugu")
          print("Sections: 6")
          print("========================================")

      - name: Show generated publication
        if: steps.existing.outputs.exists != 'true'
        env:
          TARGET_DATE: ${{ steps.date.outputs.target_date }}
        shell: python
        run: |
          import json
          import os

          path = (
              f"data/{os.environ['TARGET_DATE']}.json"
          )

          with open(
              path,
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          print("")
          print("Vidhwaan Daily Social")
          print("=====================")
          print(f"Date: {data['date']}")
          print("")
          print(
              "1. "
              f"{data['culture']['heading']}: "
              f"{data['culture']['title']}"
          )
          print(
              "2. "
              f"{data['quote']['heading']}: "
              f"{data['quote']['title']}"
          )
          print(
              "3. "
              f"{data['health']['heading']}: "
              f"{data['health']['title']}"
          )
          print(
              "4. "
              f"{data['science']['heading']}: "
              f"{data['science']['title']}"
          )
          print(
              "5. "
              f"{data['knowledge']['heading']}: "
              f"{data['knowledge']['title']}"
          )
          print(
              "6. "
              f"{data['question']['heading']}: "
              f"{data['question']['question']}"
          )
          print("")

      - name: Commit daily JSON
        if: steps.existing.outputs.exists != 'true'
        env:
          TARGET_DATE: ${{ steps.date.outputs.target_date }}
        shell: bash
        run: |
          set -euo pipefail

          TARGET_FILE="data/${TARGET_DATE}.json"

          git add -- "$TARGET_FILE"

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit \
            -m "Add Vidhwaan Daily Social content for ${TARGET_DATE}"

      - name: Push daily JSON
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail

          git push origin HEAD
