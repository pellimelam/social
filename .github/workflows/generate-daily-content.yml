name: Generate and Verify Daily Telugu Content

on:
  schedule:
    # 1:00 AM IST = 7:30 PM UTC (previous day)
    - cron: "30 19 * * *"

  workflow_dispatch:
    inputs:
      target_date:
        description: "Optional target date in YYYY-MM-DD format. Leave empty for India today."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: vidhwaan-daily-social-content
  cancel-in-progress: false

jobs:
  generate:
    name: Generate and Verify Daily Telugu Content
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      TZ: Asia/Kolkata
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: openai/gpt-oss-120b

    steps:

      # ------------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # NODE
      # ------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # ------------------------------------------------------------
      # VERIFY GROQ SECRET
      # ------------------------------------------------------------
      - name: Verify GROQ API key
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${GROQ_API_KEY:-}" ]; then
            echo "ERROR: GROQ_API_KEY secret is missing."
            exit 1
          fi

          echo "GROQ_API_KEY is available."

      # ------------------------------------------------------------
      # DETERMINE INDIA DATE
      # ------------------------------------------------------------
      - name: Determine publication date
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${{ inputs.target_date }}" ]; then
            TARGET_DATE="${{ inputs.target_date }}"
          else
            TARGET_DATE="$(TZ=Asia/Kolkata date +%Y-%m-%d)"
          fi

          if ! [[ "$TARGET_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "ERROR: Invalid target date: $TARGET_DATE"
            echo "Expected format: YYYY-MM-DD"
            exit 1
          fi

          if ! date -u -d "$TARGET_DATE" >/dev/null 2>&1; then
            echo "ERROR: Invalid calendar date: $TARGET_DATE"
            exit 1
          fi

          echo "TARGET_DATE=$TARGET_DATE" >> "$GITHUB_ENV"

          echo "Publication date: $TARGET_DATE"
          echo "Timezone: Asia/Kolkata"

      # ------------------------------------------------------------
      # CHECK EXISTING DAILY JSON
      # ------------------------------------------------------------
      - name: Check existing daily JSON
        shell: bash
        run: |
          set -euo pipefail

          FILE="data/${TARGET_DATE}.json"

          echo "Checking:"
          echo "$FILE"

          if [ -f "$FILE" ]; then
            echo
            echo "ERROR: Daily JSON already exists:"
            echo "$FILE"
            echo
            echo "Existing daily content will never be overwritten."
            exit 1
          fi

          echo "No existing JSON found. Generation can continue."

      # ------------------------------------------------------------
      # GENERATE DAILY CONTENT
      # ------------------------------------------------------------
      - name: Generate daily content
        shell: bash
        run: |
          set -euo pipefail

          echo "Generating daily Telugu content..."
          echo "Target date: $TARGET_DATE"
          echo "Model: $GROQ_MODEL"

          node generate-daily-content.js

      # ------------------------------------------------------------
      # VERIFY GENERATED FILE
      # ------------------------------------------------------------
      - name: Verify generated file exists
        shell: bash
        run: |
          set -euo pipefail

          FILE="data/${TARGET_DATE}.json"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: Expected generated file does not exist:"
            echo "$FILE"
            exit 1
          fi

          if [ ! -s "$FILE" ]; then
            echo "ERROR: Generated file is empty:"
            echo "$FILE"
            exit 1
          fi

          echo "Generated file exists:"
          echo "$FILE"

          echo
          echo "File size:"
          wc -c "$FILE"

      # ------------------------------------------------------------
      # VALIDATE JSON SYNTAX
      # ------------------------------------------------------------
      - name: Validate JSON syntax
        shell: bash
        run: |
          set -euo pipefail

          FILE="data/${TARGET_DATE}.json"

          node - "$FILE" <<'NODE'
          const fs = require("fs");

          const file = process.argv[2];

          try {
            const raw = fs.readFileSync(file, "utf8");
            JSON.parse(raw);
            console.log(`Valid JSON: ${file}`);
          } catch (error) {
            console.error(`ERROR: Invalid JSON: ${file}`);
            console.error(error.message);
            process.exit(1);
          }
          NODE

      # ------------------------------------------------------------
      # VALIDATE PRODUCTION STRUCTURE
      # ------------------------------------------------------------
      - name: Validate production structure
        shell: bash
        run: |
          set -euo pipefail

          FILE="data/${TARGET_DATE}.json"

          node - "$FILE" "$TARGET_DATE" <<'NODE'
          const fs = require("fs");

          const file = process.argv[2];
          const expectedDate = process.argv[3];

          const data = JSON.parse(fs.readFileSync(file, "utf8"));

          const expectedTopLevel = [
            "date",
            "language",
            "publisher",
            "quote",
            "health",
            "science",
            "knowledge",
            "question"
          ];

          const actualTopLevel = Object.keys(data);

          if (JSON.stringify(actualTopLevel) !== JSON.stringify(expectedTopLevel)) {
            console.error("ERROR: Top-level structure does not match production schema.");
            console.error("Expected:", expectedTopLevel);
            console.error("Actual:", actualTopLevel);
            process.exit(1);
          }

          if (data.date !== expectedDate) {
            console.error(`ERROR: Date mismatch.`);
            console.error(`Expected: ${expectedDate}`);
            console.error(`Actual: ${data.date}`);
            process.exit(1);
          }

          if (data.language !== "te") {
            console.error(`ERROR: language must be "te".`);
            process.exit(1);
          }

          if (data.publisher !== "Vidhwaan") {
            console.error(`ERROR: publisher must be "Vidhwaan".`);
            process.exit(1);
          }

          if ("culture" in data) {
            console.error("ERROR: culture field must not exist.");
            process.exit(1);
          }

          const requiredHeadings = {
            quote: "నేటి సూక్తి",
            health: "నేటి ఆరోగ్యం",
            science: "నేటి విజ్ఞానం",
            knowledge: "నేటి జ్ఞానం",
            question: "నేటి ప్రశ్న"
          };

          for (const [section, heading] of Object.entries(requiredHeadings)) {
            if (!data[section] || typeof data[section] !== "object") {
              console.error(`ERROR: Missing section: ${section}`);
              process.exit(1);
            }

            if (data[section].heading !== heading) {
              console.error(
                `ERROR: Incorrect heading for ${section}. Expected "${heading}".`
              );
              process.exit(1);
            }
          }

          const requiredFields = {
            quote: ["heading", "title", "content", "attribution"],
            health: ["heading", "title", "content"],
            science: ["heading", "title", "content"],
            knowledge: ["heading", "title", "content"],
            question: ["heading", "question", "answer"]
          };

          for (const [section, fields] of Object.entries(requiredFields)) {
            for (const field of fields) {
              if (
                typeof data[section][field] !== "string" ||
                data[section][field].trim() === ""
              ) {
                console.error(
                  `ERROR: ${section}.${field} must be a non-empty string.`
                );
                process.exit(1);
              }
            }
          }

          if (data.quote.attribution !== "Vidhwaan") {
            console.error(
              'ERROR: Quote attribution must be exactly "Vidhwaan".'
            );
            process.exit(1);
          }

          console.log("Production structure validation passed.");
          NODE

      # ------------------------------------------------------------
      # VALIDATE CONTENT SAFETY
      # ------------------------------------------------------------
      - name: Validate content safety
        shell: bash
        run: |
          set -euo pipefail

          FILE="data/${TARGET_DATE}.json"

          node - "$FILE" <<'NODE'
          const fs = require("fs");

          const file = process.argv[2];
          const data = JSON.parse(fs.readFileSync(file, "utf8"));

          const sections = [
            data.quote,
            data.health,
            data.science,
            data.knowledge,
            data.question
          ];

          const text = sections
            .map(section => Object.values(section).join(" "))
            .join(" ");

          // ----------------------------------------------------------
          // Forbidden internal / technical content
          // ----------------------------------------------------------
          const forbiddenTerms = [
            "Groq",
            "OpenAI",
            "GPT",
            "prompt",
            "schema",
            "JSON",
            "API",
            "GitHub",
            "AI model",
            "language model",
            "system message"
          ];

          for (const term of forbiddenTerms) {
            if (text.toLowerCase().includes(term.toLowerCase())) {
              console.error(
                `ERROR: Internal/technical term detected in published content: ${term}`
              );
              process.exit(1);
            }
          }

          // ----------------------------------------------------------
          // No markdown / URLs / hashtags
          // ----------------------------------------------------------
          if (/https?:\/\//i.test(text)) {
            console.error("ERROR: URL detected in published content.");
            process.exit(1);
          }

          if (/#\S+/.test(text)) {
            console.error("ERROR: Hashtag detected in published content.");
            process.exit(1);
          }

          if (/[*_`]{2,}/.test(text)) {
            console.error("ERROR: Markdown-style formatting detected.");
            process.exit(1);
          }

          // ----------------------------------------------------------
          // Health safety checks
          // ----------------------------------------------------------
          const healthText = [
            data.health.title,
            data.health.content
          ].join(" ");

          const unsafeHealthPatterns = [
            /8\s*గ్లాస్/i,
            /2\s*లీటర్/i,
            /కచ్చితంగా.*నీరు/i,
            /తప్పనిసరిగా.*నీరు/i,
            /మందు.*ఆప/i,
            /మందులు.*ఆప/i,
            /మందు.*వాడకండి/i,
            /చికిత్స/i,
            /రోగం.*నయం/i,
            /వ్యాధి.*నయం/i,
            /100%\s*నయం/i,
            /మిరాకిల్/i,
            /అద్భుత.*చికిత్స/i
          ];

          for (const pattern of unsafeHealthPatterns) {
            if (pattern.test(healthText)) {
              console.error(
                `ERROR: Potentially unsafe health claim detected: ${pattern}`
              );
              process.exit(1);
            }
          }

          // ----------------------------------------------------------
          // Known historical misinformation guard
          // ----------------------------------------------------------
          const knowledgeText = [
            data.knowledge.title,
            data.knowledge.content
          ].join(" ");

          if (
            /1911/.test(knowledgeText) &&
            /మౌంట్‌బాటన్|మౌంట్బాటన్|Mountbatten/i.test(knowledgeText)
          ) {
            console.error(
              "ERROR: Invalid Mountbatten/1911 Indian capital claim detected."
            );
            process.exit(1);
          }

          console.log("Content safety validation passed.");
          NODE

      # ------------------------------------------------------------
      # SHOW GENERATED JSON
      # ------------------------------------------------------------
      - name: Show generated JSON
        shell: bash
        run: |
          set -euo pipefail

          FILE="data/${TARGET_DATE}.json"

          echo "============================================================"
          echo "GENERATED DAILY JSON"
          echo "============================================================"

          cat "$FILE"

          echo
          echo "============================================================"

      # ------------------------------------------------------------
      # VERIFY CHANGED FILES
      #
      # IMPORTANT:
      # Git can display an entirely untracked directory as:
      #
      #   ?? data/
      #
      # --untracked-files=all forces Git to report:
      #
      #   ?? data/2026-09-28.json
      #
      # so we can verify the exact file.
      # ------------------------------------------------------------
      - name: Verify changed files
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED="data/${TARGET_DATE}.json"

          echo "Expected change:"
          echo "$EXPECTED"
          echo

          echo "Current changes:"
          git status --short --untracked-files=all
          echo

          CHANGED_FILES="$(
            git status --short --untracked-files=all |
            sed -E 's/^[[:space:]]*[?MADRCU!]+[[:space:]]+//'
          )"

          if [ -z "$CHANGED_FILES" ]; then
            echo "ERROR: No changes detected."
            exit 1
          fi

          echo "Changed file list:"
          printf '%s\n' "$CHANGED_FILES"
          echo

          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue

            if [ "$FILE" != "$EXPECTED" ]; then
              echo "ERROR: Unexpected file changed:"
              echo "$FILE"
              exit 1
            fi
          done <<< "$CHANGED_FILES"

          echo "SUCCESS: Only the expected daily JSON changed."

      # ------------------------------------------------------------
      # STAGE ONLY DAILY JSON
      # ------------------------------------------------------------
      - name: Stage daily JSON
        shell: bash
        run: |
          set -euo pipefail

          FILE="data/${TARGET_DATE}.json"

          git add -- "$FILE"

          echo "Staged:"
          git diff --cached --name-status

      # ------------------------------------------------------------
      # VERIFY STAGED JSON
      # ------------------------------------------------------------
      - name: Verify staged JSON
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED="data/${TARGET_DATE}.json"

          STAGED_FILES="$(
            git diff --cached --name-only
          )"

          if [ -z "$STAGED_FILES" ]; then
            echo "ERROR: Nothing is staged."
            exit 1
          fi

          echo "Staged files:"
          printf '%s\n' "$STAGED_FILES"
          echo

          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue

            if [ "$FILE" != "$EXPECTED" ]; then
              echo "ERROR: Unexpected staged file:"
              echo "$FILE"
              exit 1
            fi
          done <<< "$STAGED_FILES"

          echo "SUCCESS: Only the expected daily JSON is staged."

          node - "$EXPECTED" <<'NODE'
          const fs = require("fs");

          const file = process.argv[2];

          const content = fs.readFileSync(file, "utf8");
          const data = JSON.parse(content);

          if (!data || typeof data !== "object") {
            throw new Error("JSON root must be an object.");
          }

          console.log("Staged JSON is valid.");
          NODE

      # ------------------------------------------------------------
      # COMMIT DAILY JSON
      # ------------------------------------------------------------
      - name: Commit daily JSON
        shell: bash
        run: |
          set -euo pipefail

          FILE="data/${TARGET_DATE}.json"

          git config user.name "Vidhwaan"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Add daily Telugu content for ${TARGET_DATE}"

          echo "Commit created successfully."

      # ------------------------------------------------------------
      # VERIFY COMMIT CONTENT
      # ------------------------------------------------------------
      - name: Verify commit contains only daily JSON
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED="data/${TARGET_DATE}.json"

          LAST_COMMIT_FILES="$(
            git diff-tree --no-commit-id --name-only -r HEAD
          )"

          echo "Files in latest commit:"
          printf '%s\n' "$LAST_COMMIT_FILES"
          echo

          if [ -z "$LAST_COMMIT_FILES" ]; then
            echo "ERROR: Latest commit contains no files."
            exit 1
          fi

          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue

            if [ "$FILE" != "$EXPECTED" ]; then
              echo "ERROR: Latest commit contains unexpected file:"
              echo "$FILE"
              exit 1
            fi
          done <<< "$LAST_COMMIT_FILES"

          echo "SUCCESS: Latest commit contains only:"
          echo "$EXPECTED"

      # ------------------------------------------------------------
      # PUSH
      # ------------------------------------------------------------
      - name: Push daily JSON
        shell: bash
        run: |
          set -euo pipefail

          git push origin HEAD

          echo
          echo "============================================================"
          echo "SUCCESS"
          echo "============================================================"
          echo "Daily Telugu content generated and pushed."
          echo "Date: ${TARGET_DATE}"
          echo "File: data/${TARGET_DATE}.json"
          echo "============================================================"
