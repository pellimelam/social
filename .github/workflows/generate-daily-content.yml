name: Generate Vidhwaan Daily Social Content

on:
  schedule:
    - cron: "0 1 * * *"
      timezone: "Asia/Kolkata"

  workflow_dispatch:
    inputs:
      target_date:
        description: "Optional date in YYYY-MM-DD format. Leave empty for today's India date."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: vidhwaan-daily-social-content
  cancel-in-progress: false

jobs:
  generate:
    name: Generate Daily Telugu Content
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TZ: Asia/Kolkata
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: openai/gpt-oss-120b

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Configure Git
        run: |
          git config user.name "Vidhwaan Daily Social"
          git config user.email "actions@users.noreply.github.com"

      - name: Determine publication date
        id: date
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${{ inputs.target_date }}" ]; then
            TARGET_DATE="${{ inputs.target_date }}"
          else
            TARGET_DATE="$(TZ=Asia/Kolkata date '+%Y-%m-%d')"
          fi

          if ! [[ "$TARGET_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "ERROR: Invalid date: $TARGET_DATE"
            echo "Expected format: YYYY-MM-DD"
            exit 1
          fi

          if ! date -d "$TARGET_DATE" '+%Y-%m-%d' >/dev/null 2>&1; then
            echo "ERROR: Invalid calendar date: $TARGET_DATE"
            exit 1
          fi

          echo "target_date=$TARGET_DATE" >> "$GITHUB_OUTPUT"

          echo "========================================"
          echo "Vidhwaan Daily Social"
          echo "Publication date: $TARGET_DATE"
          echo "Timezone: Asia/Kolkata"
          echo "========================================"

      - name: Check existing daily JSON
        id: existing
        shell: bash
        run: |
          set -euo pipefail

          TARGET_DATE="${{ steps.date.outputs.target_date }}"
          TARGET_FILE="data/${TARGET_DATE}.json"

          if [ -f "$TARGET_FILE" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"

            echo "Today's JSON already exists:"
            echo "$TARGET_FILE"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"

            echo "No JSON exists for:"
            echo "$TARGET_DATE"
          fi

      - name: Generate daily content
        if: steps.existing.outputs.exists != 'true'
        env:
          TARGET_DATE: ${{ steps.date.outputs.target_date }}
        run: |
          node generate-daily-content.js

      - name: Verify generated JSON
        if: steps.existing.outputs.exists != 'true'
        env:
          TARGET_DATE: ${{ steps.date.outputs.target_date }}
        shell: bash
        run: |
          set -euo pipefail

          TARGET_FILE="data/${TARGET_DATE}.json"

          if [ ! -f "$TARGET_FILE" ]; then
            echo "ERROR: Expected JSON was not created:"
            echo "$TARGET_FILE"
            exit 1
          fi

          echo "Generated file:"
          echo "$TARGET_FILE"

          echo ""
          echo "File size:"
          wc -c "$TARGET_FILE"

          echo ""
          echo "JSON validation:"
          node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')); console.log('Valid JSON')" "$TARGET_FILE"

      - name: Show generated file
        if: steps.existing.outputs.exists != 'true'
        env:
          TARGET_DATE: ${{ steps.date.outputs.target_date }}
        run: |
          echo "========================================"
          echo "Generated daily content"
          echo "========================================"

          cat "data/${TARGET_DATE}.json"

      - name: Commit daily JSON
        if: steps.existing.outputs.exists != 'true'
        env:
          TARGET_DATE: ${{ steps.date.outputs.target_date }}
        run: |
          set -euo pipefail

          TARGET_FILE="data/${TARGET_DATE}.json"

          git add -- "$TARGET_FILE"

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit \
            -m "Add Vidhwaan Daily Social content for ${TARGET_DATE}"

      - name: Push daily JSON
        if: steps.existing.outputs.exists != 'true'
        run: |
          set -euo pipefail

          git push origin HEAD
