name: Protect and Deploy Frontend

on:
  push:
    branches:
      - main
    paths-ignore:
      - "public/**"
      - ".github/workflows/protect.yml"

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Protected Public Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Show Node and npm Versions
        run: |
          set -e

          node --version
          npm --version

      - name: Verify Required Source Files
        run: |
          set -e

          test -f package.json
          test -f scripts/protect.js
          test -f index.html
          test -f app.js
          test -f main.css

          echo "Required source files found."

      - name: Install Dependencies
        run: |
          set -e

          npm install \
            --no-audit \
            --no-fund \
            --package-lock=false

      - name: Run Protection Build
        run: |
          set -e

          npm run protect

      - name: Verify Source Files Were Not Modified
        run: |
          set -e

          echo "Checking source files..."

          CHANGES="$(
            git status \
              --porcelain=v1 \
              --untracked-files=all \
              -- \
              . \
              ':(exclude)public/**' \
              ':(exclude)node_modules/**'
          )"

          if [ -n "$CHANGES" ]; then
            echo "ERROR: Source files were modified outside public/."
            echo
            echo "$CHANGES"
            echo
            exit 1
          fi

          echo "SUCCESS: Source files remain unchanged."

      - name: Verify Public Build
        run: |
          set -e

          test -d public
          test -f public/index.html

          if [ ! -s public/index.html ]; then
            echo "ERROR: public/index.html is empty."
            exit 1
          fi

          echo "public/index.html exists and is non-empty."

      - name: Verify Custom Domain
        run: |
          set -e

          if [ ! -f public/CNAME ]; then
            echo "ERROR: public/CNAME was not generated."
            exit 1
          fi

          DOMAIN="$(tr -d '\r\n' < public/CNAME)"

          if [ "$DOMAIN" != "social.vidhwaan.com" ]; then
            echo "ERROR: Incorrect CNAME."
            echo "Expected: social.vidhwaan.com"
            echo "Found:    $DOMAIN"
            exit 1
          fi

          echo "CNAME verified: $DOMAIN"

      - name: Verify Public Directory
        run: |
          set -e

          FILE_COUNT="$(find public -type f | wc -l)"

          echo "Protected files: $FILE_COUNT"

          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "ERROR: public directory is empty."
            exit 1
          fi

      - name: Show Public Files
        run: |
          set -e

          echo "Protected deployment files:"
          find public -type f | sort

      - name: Configure Git Identity
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit Protected Public Files
        run: |
          set -e

          git add -f public/

          if git diff --cached --quiet; then
            echo "No changes in public/. Nothing to commit."
          else
            git commit -m "Deploy protected frontend"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest

    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Pages Artifact
        id: deployment
        uses: actions/deploy-pages@v4
